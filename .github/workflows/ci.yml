name: CI

on:
  push:
    branches: [master, v2-lan]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build DisplayBoard.slnx -c Release
      - name: Test
        run: dotnet test DisplayBoard.slnx -c Release --no-build
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: TestResults/screenshots
          if-no-files-found: ignore
      - name: Package
        run: powershell -ExecutionPolicy Bypass -File tools/publish.ps1
      # File cài để tải về: trang Actions > lần chạy > Artifacts > DisplayBoard-win-x64.
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: DisplayBoard-win-x64
          path: dist/DisplayBoard
          retention-days: 30
