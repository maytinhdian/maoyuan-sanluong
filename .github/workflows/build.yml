name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build DisplayBoard/DisplayBoard.sln -c Release
      - run: dotnet test DisplayBoard/DisplayBoard.sln -c Release --no-build
